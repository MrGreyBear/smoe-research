[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "smoe"
version = "0.1.0"
description = "Semantic Mixture of Experts: white-box distributional forecasting for financial returns"
requires-python = ">=3.11"
dependencies = [
  "numpy", "scipy", "pandas", "statsmodels", "arch", "scikit-learn",
  "xgboost", "torch", "akshare", "yfinance", "matplotlib",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
